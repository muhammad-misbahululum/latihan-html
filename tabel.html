<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Contoh Tabel dengan Sel Gabungan (colspan/rowspan)</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f5f5;
    padding: 30px;/*  */
  }
  .grid-container {
    display: flex;
    /* flex-wrap: wrap; */
    gap: 40px;
  }
  .box {
    text-align: center;
  }
  .box h3 {
    margin-bottom: 8px;
    color: #333;
  }
  table {
    border-collapse: collapse;
  }
  table td {
    border: 3px solid #e63946;
    width: 70px;
    height: 70px;
    text-align: center;
    vertical-align: middle;
    font-size: 22px;
    font-weight: bold;
    color: #e63946;
    background: #fff;
  }
</style>
</head>
<body>

<div class="grid-container">

  <div class="box">
    <h3>Tabel 1</h3>
    <table>
      <tr><td>1</td><td>2</td><td>3</td></tr>
      <tr><td>4</td><td>5</td><td>6</td></tr>
      <tr><td>7</td><td>8</td><td>9</td></tr>
    </table>
  </div>

  <div class="box">
    <h3>Tabel 2</h3>
    <table>
      <tr><td>1</td><td colspan="2">2</td></tr>
      <tr><td>3</td><td>4</td><td>5</td></tr>
      <tr><td>6</td><td>7</td><td>8</td></tr>
    </table>
  </div>

  <div class="box">
    <h3>Tabel 3</h3>
    <table>
      <tr><td>1</td><td>2</td><td>3</td></tr>
      <tr><td colspan="3">4</td></tr>
      <tr><td>5</td><td>6</td><td>7</td></tr>
    </table>
  </div>

  <div class="box">
    <h3>Tabel 4</h3>
    <table>
      <tr><td>1</td><td colspan="2">2</td></tr>
      <tr><td>3</td><td>4</td><td>5</td></tr>
      <tr><td colspan="2">6</td><td>7</td></tr>
    </table>
  </div>

  <div class="box">
    <h3>Tabel 5</h3>
    <table>
      <tr><td rowspan="2">1</td><td>2</td><td rowspan="2">4</td></tr>
      <tr><td>3</td></tr>
      <tr><td>5</td><td>6</td><td>7</td></tr>
    </table>
  </div>

</div>

</body>
</html>
